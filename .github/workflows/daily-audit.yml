# MeuOS Kit — 每日代码校验与缺陷检查
#
# 分支模型（B：严格隔离）：
#   - daily-audit  ：常驻工作目录（含审计脚本），推送远端、永不合并到 main；
#                     定期 `merge main -> daily-audit` 保持同步。
#   - daily-<MMDD> ：每日结果分支，基于 main，仅含 `.issues/<MMDD>.md` 与修复；
#                     直接 PR 到 main（报告+修复同支，修复工作复用该分支）。
#
# 触发（每天 4 次，北京时间：02:00 / 08:00 / 14:00 / 20:00；GitHub Actions 的 cron 为 UTC，
#        故换算为 18:00 / 00:00 / 06:00 / 12:00 UTC；亦支持手动 workflow_dispatch）：
#   每次运行都是「查缺补漏式追加」，不会覆盖已有报告：
#   1. 首跑（结果分支不存在）：从 daily-audit 跑脚本生成基础报告（含 Agent 复核占位）
#   2. 后续运行：先同步远端最新报告，再 `--append` 刷新缺陷扫描/git 区间并追加修订记录
#   3. 提交到 daily-<MMDD>（基于 origin/daily-<MMDD>，缺失则基于 main），自动开 PR 到 main
#   注：脚本只做数据驱动核查；AI 深度复核由 CodeBuddy `/loop`（见 scripts/audit-loop-prompt.md）
#       在任意一次运行后补充，二者都先同步远端，互不覆盖。
#
# 注：GitHub Actions 的 cron 为 UTC。若需「本地时间」的 2/8/14/20，请按时区换算。
name: Daily Code Audit

on:
  schedule:
    # 以下为北京时间 02:00 / 08:00 / 14:00 / 20:00 对应的 UTC 等价时刻
    - cron: '0 18 * * *'       # 北京时间 02:00（UTC 18:00）
    - cron: '0 0 * * *'        # 北京时间 08:00（UTC 00:00）
    - cron: '0 6 * * *'        # 北京时间 14:00（UTC 06:00）
    - cron: '0 12 * * *'       # 北京时间 20:00（UTC 12:00）
  workflow_dispatch:           # 允许手动触发

permissions:
  contents: write              # 推送 daily-<MMDD> 分支、提交报告
  pull-requests: write         # 自动开 PR

concurrency:
  group: daily-audit
  cancel-in-progress: false    # 串行执行，避免多次运行并发互相覆盖

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # 取用 daily-audit 工作目录（含审计脚本）
      - name: Checkout（daily-audit 工作目录）
        uses: actions/checkout@v4
        with:
          ref: daily-audit
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential qemu-user 2>/dev/null || true
          # env/bin/ 内含交叉架构 qemu 静态二进制，供多架构回归

      - name: 计算日期与结果分支
        id: meta
        run: |
          DATE="$(date -u +%m%d)"
          echo "date=$DATE"          >> "$GITHUB_OUTPUT"
          echo "branch=daily/$DATE"  >> "$GITHUB_OUTPUT"

      # 判断今日结果分支是否已存在（决定首跑全量 / 后续追加）
      - name: 检查结果分支状态
        id: state
        run: |
          if git ls-remote --heads origin "refs/heads/daily/${{ steps.meta.outputs.date }}" | grep -q .; then
            echo "has_branch=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_branch=false" >> "$GITHUB_OUTPUT"
          fi

      # 后续运行：先把远端最新报告同步到工作树，避免覆盖 Agent 已填内容
      - name: 同步远端最新报告（仅后续运行）
        if: ${{ steps.state.outputs.has_branch == 'true' }}
        run: |
          git fetch origin "daily/${{ steps.meta.outputs.date }}" 2>/dev/null || true
          git show "origin/daily/${{ steps.meta.outputs.date }}:.issues/${{ steps.meta.outputs.date }}.md" \
            > ".issues/${{ steps.meta.outputs.date }}.md" 2>/dev/null || true

      # 在 daily-audit 上运行脚本：首跑 --agent（留 Agent 占位），后续 --append（查缺补漏）
      - name: 运行每日审计（脚本位于 daily-audit）
        env:
          MEUOS_SYSROOT: ${{ github.workspace }}/sysroot
          HAS_BRANCH: ${{ steps.state.outputs.has_branch }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          git config user.name  "meuos-audit[bot]"
          git config user.email "meuos-audit[bot]@users.noreply.github.com"
          if [ "$HAS_BRANCH" = "true" ]; then MODE=--append; else MODE=--agent; fi
          bash scripts/daily-audit.sh --date "$DATE" $MODE --sysroot "$MEUOS_SYSROOT"
        continue-on-error: true   # 检查失败也是“发现”，仍要落盘报告

      # 把报告提交到 daily-<MMDD>（基于 origin/daily-<MMDD>，缺失则基于 main）
      - name: 把报告提交到 daily-<MMDD>
        env:
          DATE: ${{ steps.meta.outputs.date }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          git fetch origin "$BRANCH" 2>/dev/null || true
          git checkout -B "$BRANCH" "origin/$BRANCH" 2>/dev/null || git checkout -B "$BRANCH" origin/main
          mkdir -p .issues
          git add .issues/"$DATE".md
          if git diff --cached --quiet; then
            echo "无报告变更，跳过提交。"
            exit 0
          fi
          git commit -m "audit: 每日代码校验与缺陷检查 $DATE"
          git push -u origin "$BRANCH"
        continue-on-error: true

      - name: 自动开 PR 到 main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.meta.outputs.date }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          if gh pr list --head "$BRANCH" --state open --json number | grep -q '\[{'; then
            echo "PR 已存在，跳过。"
            exit 0
          fi
          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "audit: 每日代码校验与缺陷检查 $DATE" \
            --body "每日定时审计自动生成（每天 4 次查缺补漏：北京时间 02/08/14/20，即 UTC 18/0/6/12）。结果分支基于 main，仅含报告 .issues/$DATE.md。本 PR 由 GitHub Actions 开启；修复请直接推送到本分支（daily/$DATE），报告与修复同支，复核通过后合并到 main。深度语义审查由 CodeBuddy /loop 或人工复核，可在任意一次运行后补充。" || echo "PR 创建跳过（可能已存在或权限受限）。"
