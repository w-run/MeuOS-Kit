# MeuOS Kit — 每日代码校验与缺陷检查
#
# 分支模型（B：严格隔离）：
#   - daily-audit  ：常驻工作目录（含审计脚本），推送远端、永不合并到 main；
#                     定期 `merge main -> daily-audit` 保持同步。
#   - daily-<MMDD> ：每日结果分支，基于 main，仅含 `.issues/<MMDD>.md` 与修复；
#                     直接 PR 到 main（报告+修复同支，修复工作复用该分支）。
#
# 触发（UTC 每天 00:00 ≈ 北京时间 08:00；亦支持手动 workflow_dispatch）：
#   1. 从 daily-audit 工作目录运行 scripts/daily-audit.sh（脚本在 daily-audit 上）
#   2. 把生成的报告搬到「基于 main」的 daily-<MMDD> 分支并提交
#   3. 自动开 PR 到 main（PR 仅含报告，修复由 Agent 直接推到该分支）
#
# 注：GitHub Actions 的 cron 只认默认分支（main）上的 workflow 文件，故本文件置于
#     main；它通过 `ref: daily-audit` 取用工作目录中的脚本。CodeBuddy `/loop` 亦可驱动。
name: Daily Code Audit

on:
  schedule:
    - cron: '0 0 * * *'        # UTC 每天 00:00
  workflow_dispatch:           # 允许手动触发

permissions:
  contents: write              # 推送 daily-<MMDD> 分支、提交报告
  pull-requests: write         # 自动开 PR

concurrency:
  group: daily-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # 取用 daily-audit 工作目录（含审计脚本）；完整历史供 git 区间统计
      - name: Checkout（daily-audit 工作目录）
        uses: actions/checkout@v4
        with:
          ref: daily-audit
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential qemu-user 2>/dev/null || true
          # env/bin/ 内含交叉架构 qemu 静态二进制，供多架构回归

      - name: 计算日期与结果分支
        id: meta
        run: |
          DATE="$(date -u +%m%d)"
          echo "date=$DATE"          >> "$GITHUB_OUTPUT"
          echo "branch=daily/$DATE"  >> "$GITHUB_OUTPUT"

      # 幂等：结果分支已存在则跳过
      - name: 若今日结果分支已存在则跳过
        id: skip
        run: |
          if git ls-remote --heads origin "refs/heads/daily/${{ steps.meta.outputs.date }}" | grep -q .; then
            echo "今日结果分支已存在，跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # 在 daily-audit 上运行脚本，生成报告（未跟踪文件，留在工作树）
      - name: 运行每日审计（脚本位于 daily-audit）
        if: ${{ steps.skip.outputs.skip != 'true' }}
        env:
          MEUOS_SYSROOT: ${{ github.workspace }}/sysroot
        run: |
          git config user.name  "meuos-audit[bot]"
          git config user.email "meuos-audit[bot]@users.noreply.github.com"
          bash scripts/daily-audit.sh --date "$DATE" --sysroot "$MEUOS_SYSROOT"
        continue-on-error: true   # 检查失败也是“发现”，仍要落盘报告

      # 把报告搬到「基于 main」的结果分支，仅提交报告（保持 PR 干净）
      - name: 把报告提交到 daily-<MMDD>（基于 main）
        if: ${{ steps.skip.outputs.skip != 'true' }}
        env:
          DATE: ${{ steps.meta.outputs.date }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          mkdir -p .issues
          git add .issues/"$DATE".md
          if git diff --cached --quiet; then
            echo "无报告可提交，跳过。"
            exit 0
          fi
          git commit -m "audit: 每日代码校验与缺陷检查 $DATE"
          git push -u origin "$BRANCH"
        continue-on-error: true

      - name: 自动开 PR 到 main
        if: ${{ steps.skip.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.meta.outputs.date }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          if gh pr list --head "$BRANCH" --state open --json number | grep -q '\[{'; then
            echo "PR 已存在，跳过。"
            exit 0
          fi
          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "audit: 每日代码校验与缺陷检查 $DATE" \
            --body "每日定时审计自动生成。结果分支基于 main，仅含报告 .issues/$DATE.md。本 PR 由 GitHub Actions 在 UTC 凌晨自动开启；修复请直接推送到本分支（daily/$DATE），报告与修复同支，复核通过后合并到 main。深度语义审查由 CodeBuddy /loop 或人工复核。" || echo "PR 创建跳过（可能已存在或权限受限）。"
