name: dash
version: 0.5.12
source: http://gondor.apana.org.au/~herbert/dash/files/dash-0.5.12.tar.gz

variables:
  CC: mcc
  CFLAGS: -O2 --sysroot=${MEUOS_SYSROOT}

default: all

targets:
  all:
    deps: [install]
  fetch:
    commands:
      - wget -c http://gondor.apana.org.au/~herbert/dash/files/dash-0.5.12.tar.gz -O ${DL_DIR:-/tmp}/dash-0.5.12.tar.gz
  unpack:
    deps: [fetch]
    commands:
      - mkdir -p ${BUILD_DIR:-/tmp/meow-build} && tar xf ${DL_DIR:-/tmp}/dash-0.5.12.tar.gz -C ${BUILD_DIR:-/tmp/meow-build}
  build:
    deps: [unpack]
    commands:
      - cd ${BUILD_DIR:-/tmp/meow-build}/dash-0.5.12 && ./configure --host=${HOST:-x86_64-unknown-linux} --prefix=/usr && make
  install:
    deps: [build]
    commands:
      - cd ${BUILD_DIR:-/tmp/meow-build}/dash-0.5.12 && make DESTDIR=${MEUOS_SYSROOT} install
  clean:
    commands:
      - rm -rf ${BUILD_DIR:-/tmp/meow-build}/dash-0.5.12
