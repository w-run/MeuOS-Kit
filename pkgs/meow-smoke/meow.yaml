name: meow-smoke
version: 1

default: all

targets:
  all:
    deps: [verify]
  prepare:
    commands:
      - printf prepare > /tmp/meow-smoke.order
  verify:
    deps: [prepare]
    commands:
      - test "$(cat /tmp/meow-smoke.order)" = prepare
  clean:
    commands:
      - rm -f /tmp/meow-smoke.order
