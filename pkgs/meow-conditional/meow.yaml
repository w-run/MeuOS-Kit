name: meow-conditional
version: 1.0

default: all

targets:
  all:
    deps: [native]
  native:
    when: ARCH == "x86_64"
    commands:
      - printf "native" > /tmp/meow-conditional.result
  not-native:
    when: ARCH != "x86_64"
    commands:
      - printf "cross" > /tmp/meow-conditional.result
  verify:
    deps: [native]
    commands:
      - test "$(cat /tmp/meow-conditional.result)" = "native"
  clean:
    commands:
      - rm -f /tmp/meow-conditional.result
