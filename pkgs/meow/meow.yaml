name: meow
version: 1.0
default: meow

variables:
  BLD: projects/meow/build
  CFLAGS: --specs=meuos --sysroot=/workspace/MeuOS-Kit/projects/sysroot --nostdlib

targets:
  meow:
    phony: true
    commands:
      - mkdir -p ${BLD}
      - projects/mcc/mcc ${CFLAGS} -Iprojects/meow/src -c projects/meow/src/main.c -o ${BLD}/main.o
      - projects/mcc/mcc ${CFLAGS} -Iprojects/meow/src -c projects/meow/src/state.c -o ${BLD}/state.o
      - projects/mcc/mcc ${CFLAGS} -Iprojects/meow/src -c projects/meow/src/exec.c -o ${BLD}/exec.o
      - projects/mcc/mcc ${CFLAGS} -Iprojects/meow/src -c projects/meow/src/recipe.c -o ${BLD}/recipe.o
      - projects/mcc/mcc ${CFLAGS} -Iprojects/meow/src -c projects/meow/src/parse.c -o ${BLD}/parse.o
      - projects/mcc/mcc ${CFLAGS} -Iprojects/meow/src -c projects/meow/src/graph.c -o ${BLD}/graph.o
      - projects/mcc/mcc ${CFLAGS} -Iprojects/meow/src -c projects/meow/src/probe.c -o ${BLD}/probe.o
      - projects/mcc/mcc ${CFLAGS} -o ${BLD}/meow ${BLD}/main.o ${BLD}/state.o ${BLD}/exec.o ${BLD}/recipe.o ${BLD}/parse.o ${BLD}/graph.o ${BLD}/probe.o -l:libc-meuos.a

  clean:
    commands:
      - rm -rf ${BLD}
