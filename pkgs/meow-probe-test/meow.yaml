name: meow-probe-test
version: 1
probe:
  cc: /workspace/MeuOS-Kit/projects/mcc/mcc
  cflags: --specs=meuos --sysroot=/workspace/MeuOS-Kit/projects/sysroot
  config: config.h
  headers:
    - stdlib.h
    - stdio.h
    - sys/stat.h
    - inttypes.h
    - paths.h
  functions:
    - strdup
    - getline
  decls:
    - isblank
  codes:
    - HAVE_ST_MTIM: '#include <sys/stat.h>\nint main(void){struct stat s;return (int)sizeof(s.st_mtim);}'
default: show
targets:
  show:
    commands:
      - echo "config.h:"; cat ${BLD_DIR:-.}/config.h
  clean:
    commands:
      - rm -f config.h
