name: bzip2
version: 1.0.8
source: https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
sha256: ab5a031276eea6a0650ecf268d1b4839b7377c4c912b0b1c7c33a3d71616b8e8

variables:
  CC: /workspace/MeuOS-Kit/projects/mcc/mcc
  AR: ar
  CFLAGS: -O2 --specs=meuos --sysroot=/workspace/MeuOS-Kit/sysroot -D_FILE_OFFSET_BITS=64 -I${SRC_DIR}
  SRC_DIR: /tmp/meow-build/bzip2-1.0.8
  BLD_DIR: /tmp/meow-build/bzip2-1.0.8
  TARBALL: /tmp/bzip2-1.0.8.tar.gz

default: all

targets:
  all:
    deps: [bzip2, bzip2recover]

  fetch:
    commands:
      - test -f ${TARBALL} || wget -c https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz -O ${TARBALL}
  unpack:
    deps: [fetch]
    commands:
      - mkdir -p /tmp/meow-build && tar xf ${TARBALL} -C /tmp/meow-build

  # Pattern rule: compile .c to .o
  %.o:
    deps: [unpack]
    inputs: [${SRC_DIR}/%.c]
    outputs: [${BLD_DIR}/%.o]
    commands:
      - ${CC} ${CFLAGS} -c ${SRC_DIR}/$*.c -o ${BLD_DIR}/$*.o

  # Archive libbz2.a — depends on all 7 library object files
  libbz2.a:
    deps: [unpack, blocksort.o, huffman.o, crctable.o, randtable.o, compress.o, decompress.o, bzlib.o]
    outputs: [${BLD_DIR}/libbz2.a]
    commands:
      - ${AR} rcs ${BLD_DIR}/libbz2.a ${BLD_DIR}/blocksort.o ${BLD_DIR}/huffman.o ${BLD_DIR}/crctable.o ${BLD_DIR}/randtable.o ${BLD_DIR}/compress.o ${BLD_DIR}/decompress.o ${BLD_DIR}/bzlib.o

  # bzip2 tool (bzip2.o handled by %.o pattern)
  bzip2:
    deps: [libbz2.a, bzip2.o]
    outputs: [${BLD_DIR}/bzip2]
    commands:
      - ${CC} ${CFLAGS} -o ${BLD_DIR}/bzip2 ${BLD_DIR}/bzip2.o -L${BLD_DIR} -lbz2

  # bzip2recover (bzip2recover.o handled by %.o pattern)
  bzip2recover:
    deps: [libbz2.a, bzip2recover.o]
    outputs: [${BLD_DIR}/bzip2recover]
    commands:
      - ${CC} ${CFLAGS} -o ${BLD_DIR}/bzip2recover ${BLD_DIR}/bzip2recover.o -L${BLD_DIR} -lbz2

  # Test the built binary
  test:
    deps: [bzip2]
    commands:
      - echo "hello" | ${BLD_DIR}/bzip2 | ${BLD_DIR}/bzip2 -d | grep hello

  clean:
    commands:
      - rm -f ${BLD_DIR}/*.o ${BLD_DIR}/bzip2 ${BLD_DIR}/bzip2recover ${BLD_DIR}/libbz2.a
