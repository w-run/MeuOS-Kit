name: meuos-libc
version: 1.0
default: all

variables:
  BLD: projects/meuos-libc/build/x86_64
  CC: cc
  AR: ar

targets:
  all:
    deps: [libc-meuos.a, libatomic-meuos.a, crt1.o]

  libc-meuos.a:
    phony: true
    commands:
      - mkdir -p ${BLD}/arch ${BLD}/crt ${BLD}/internal ${BLD}/string ${BLD}/stdlib ${BLD}/stdio ${BLD}/syscall ${BLD}/thread ${BLD}/ctype ${BLD}/signal ${BLD}/dirent ${BLD}/errno
      - cd projects/meuos-libc && find src -path 'src/compat' -prune -o -name '*.c' -print | while read f; do mkdir -p "${BLD}/$(dirname "$f")"; cc -Iinclude -Isrc -c "$f" -o "${BLD}/${f%.c}.o"; done
      - cc -c projects/meuos-libc/crt/x86_64/crt1.S -o ${BLD}/crt/crt1.o
      - cc -c projects/meuos-libc/src/internal/arch/x86_64/syscall.S -o ${BLD}/internal/syscall.o
      - cc -c projects/meuos-libc/src/arch/x86_64/atomic.S -o ${BLD}/arch/atomic.o
      - cc -c projects/meuos-libc/src/arch/x86_64/setjmp.S -o ${BLD}/arch/setjmp.o
      - cc -c projects/meuos-libc/src/arch/x86_64/sigreturn.S -o ${BLD}/arch/sigreturn.o
      - cc -c projects/meuos-libc/src/arch/x86_64/thread_clone.S -o ${BLD}/arch/thread_clone.o
      - cd ${BLD} && find . -name '*.o' ! -name 'atomic.o' ! -name 'crt1.o' ! -path './compat/*' | sort | xargs ${AR} rcs libc-meuos.a
      - mv ${BLD}/crt/crt1.o ${BLD}/

  libatomic-meuos.a:
    phony: true
    commands:
      - mkdir -p ${BLD}/arch
      - cc -c projects/meuos-libc/src/arch/x86_64/atomic.S -o ${BLD}/arch/atomic.o
      - ${AR} rcs ${BLD}/libatomic-meuos.a ${BLD}/arch/atomic.o

  crt1.o:
    phony: true
    commands:
      - mkdir -p ${BLD}
      - cc -c projects/meuos-libc/crt/x86_64/crt1.S -o ${BLD}/crt1.o

  clean:
    commands:
      - rm -rf projects/meuos-libc/build
