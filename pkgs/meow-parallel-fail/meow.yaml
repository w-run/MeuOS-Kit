name: meow-parallel-fail
version: 1

default: all

targets:
  all:
    deps: [fails, other]
    phony: true
    commands:
      - touch /tmp/meow-parallel-fail-downstream
  fails:
    phony: true
    commands:
      - false
  other:
    phony: true
    commands:
      - touch /tmp/meow-parallel-fail-other
  clean:
    phony: true
    commands:
      - rm -f /tmp/meow-parallel-fail-downstream /tmp/meow-parallel-fail-other
