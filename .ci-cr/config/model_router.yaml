# 模型路由与调度策略
#
# Provider 说明（按优先级排列）：
#
#   [主力] arkcli       : ark-coding-plan，周期重置。提供 glm5.2、dsv4pro/flash、minimax-m3
#   [主力] minimax      : minimax-plan，周期重置。提供 minimax-m3
#   [免费] codebuddy:hy3: 腾讯云混元 3，持续免费到 2026 年 8 月，适合执行器
#   [应急] codebuddy    : 腾讯云 CLI（每月 500 免费积分）。仅主力耗尽时启用，
#                         走 dsv4pro/flash（glm5.2 不划算，18 积分/次）
#   [末位] nvidia_nim   : NVIDIA NIM OpenAI 兼容 REST（free tier；排队冷启动不稳）
#
# 消耗优先级：ark-coding-plan / minimax-plan（主力）→ codebuddy / nim（应急）
#
# max_tokens 说明：编译器项目脑力任务经常需要吐完整函数/类/模块，按
# Ark/MiniMax 输出上限 32k 设上限；executor 走短指令 8k；NIM 末位保守 8k。
#
# secret 管理（GitIgnored）：见 secret.yaml + env $MINIMAX_API_KEY / $NVIDIA_API_KEY

models:
    # ============================================================
    # 主力层：ark-coding-plan（周期重置）
    # ============================================================

    # 脑力主力 - 复杂推理用 glm5.2
    brain_primary:
        provider: arkcli
        model: glm-5-2
        min_balance_ratio: 0.0
        max_tokens: 128000
        fallback_models:
            - arkcli:deepseek-v4-pro
            - minimax:minimax-m3

    # 脑力备选 - minimax 中等质量
    brain_fallback:
        provider: minimax
        model: minimax-m3
        min_balance_ratio: 0.0
        max_tokens: 128000
        fallback_models:
            - codebuddy:deepseek-v4-pro
            - codebuddy:deepseek-v4-flash

    # 脑力应急 - ark-coding-plan / minimax-plan 耗尽时切 NIM
    brain_emergency:
        provider: nvidia_nim
        model: z-ai/glm-5.2
        min_balance_ratio: 0.0
        max_tokens: 32000
        fallback_models:
            - nvidia_nim:deepseek-ai/deepseek-v4-pro
            - nvidia_nim:deepseek-ai/deepseek-v4-flash

    # ============================================================
    # 执行器层：hy3 免费到 8 月，主力耗尽后降级
    # ============================================================

    executor:
        provider: codebuddy
        model: hy3
        min_balance_ratio: 0.0
        max_tokens: 32000
        credit_per_call: 0 # 免费，不计入预算
        fallback_models:
            - arkcli:deepseek-v4-flash
            - minimax:minimax-m3
            - codebuddy:deepseek-v4-flash

    # ============================================================
    # 末位回退层：仅主力全部耗尽时启用
    # ============================================================

    # codebuddy 应急 - 走 dsv4pro/flash，不用 glm5.2（不划算）
    brain_emergency_codebuddy:
        provider: codebuddy
        model: deepseek-v4-pro
        min_balance_ratio: 0.0
        max_tokens: 32000
        credit_per_call: 9
        fallback_models:
            - codebuddy:deepseek-v4-flash
            - nvidia_nim:mistralai/mixtral-8x7b-instruct-v0.1

    # NIM 末位回退（仅所有 plan/codebuddy 都耗尽时）
    brain_emergency_nim:
        provider: nvidia_nim
        model: mistralai/mixtral-8x7b-instruct-v0.1
        base_url: https://ai-api-proxy.w-run.dev/nvidia/v1
        min_balance_ratio: 0.0
        max_tokens: 32000

thresholds:
    critical_balance: 0.05
    session_ttl_minutes: 120
    max_hotfix_retries: 3
    zombie_lock_minutes: 30
    network_retry_count: 3
    network_backoff_base: 2

    # codebuddy 月度预算（免费 500/月，仅应急时消耗）
    monthly_credit_budget: 500
    monthly_credit_warning: 400
    # NIM 单次调用超时（秒）
    nim_per_call_timeout: 20
    nim_concurrent_fallback: true
    # MiniMax 限速保护
    minimax_rpm_limit: 60
    minimax_backoff_seconds: 2
